# push·PR마다 백엔드 테스트(비용 가드 포함)와 웹 UI 검사·빌드를 돌린다.
# 사용자 환경과 같은 Windows에서 돌린다. 공개 저장소라 기본 러너는 무료다.
# 렌더는 가장 자주 고치는 곳이라 FFmpeg를 설치해 test_render.py 등도 돌린다(전에는 건너뛰었다).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: shortforge/backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: shortforge/backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # 러너에 있는 Chocolatey로 FFmpeg를 설치한다. 없으면 렌더 테스트가 조용히 건너뛰므로 버전을 찍어 확인한다
      - name: FFmpeg (렌더 테스트용)
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -hide_banner -version
      - run: uv run pytest -q -rs

  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: shortforge/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shortforge/frontend/package-lock.json
      - run: npm ci
      # PageProps·LayoutProps 같은 전역 타입은 next가 만든다 (새 checkout에는 .next가 없다)
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      # 화면 자동 테스트: Fake API(DEV_FAKE_ALL) + 방금 만든 빌드를 Edge(러너에 설치됨)로 확인한다
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: shortforge/backend/uv.lock
      - run: uv sync --locked
        working-directory: shortforge/backend
      - run: npx playwright test
