# push·PR마다 백엔드 테스트(비용 가드 포함)와 웹 UI 검사·빌드를 돌린다.
# 사용자 환경과 같은 Windows에서 돌린다. 비공개 저장소의 무료 Actions 분 안에서만 쓴다(결제 수단 없음 → 넘으면 멈춤).
# FFmpeg가 없으므로 test_render.py는 건너뛴다(개발 PC에서 확인).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: shortforge/backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: shortforge/backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: shortforge/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shortforge/frontend/package-lock.json
      - run: npm ci
      # PageProps·LayoutProps 같은 전역 타입은 next가 만든다 (새 checkout에는 .next가 없다)
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
